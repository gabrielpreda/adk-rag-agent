manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: gabrielpreda/adk-rag-agent
    source: https://github.com/gabrielpreda/adk-rag-agent
    branch: main
    commit: "c5c5cd67"
    scope: [adk-rag-agent/agent.py, adk-rag-agent/prompts.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:40:20Z'
    url: https://a2as.org/certified/agents/gabrielpreda/adk-rag-agent
  signatures:
    digest: sha256:4Tr8Bok6IGrhw5ymmSxx5UJHLICDGN4uiJbCFnjwNN0
    key: ed25519:QNySHIJduEGXdaUmQUZGjTR5FW-zVV1VIZSeTr9x-do
    sig: ed25519:v0s134MSQab8gLgiSgLNAs-KqYDEh3RQWBr8ZQAF6CqeITUCDAJ-USlAw9f6hfADnFF_kb7w_i9XIh9_1DtrCw

agents:
  analyzer_agent:
    type: instance
    models: [gemini-2.5-pro]
    params:
      name: RAGAnalyzerAgent
      description: Analyzes retrieved passages and produces a structured synthesis.
      output_key: analysis_memo
      instruction: return_instructions_rag_analyser()
  final_answer_agent:
    type: instance
    models: [gemini-2.5-pro]
    params:
      name: RAGFinalAnswerAgent
      description: Writes the final answer with citations to retrieved passages.
      output_key: final_answer
      instruction: return_instructions_rag_final_answer()
  retriever_agent:
    type: instance
    models: [gemini-2.5-pro]
    tools: [rag_retrieval_tool]
    params:
      name: RAGRetrieverAgent
      description: Calls the RAG tool and returns normalized passages as JSON for downstream agents.
      output_key: retrieved_passages_json
      instruction: return_instructions_rag_retriever()
  root_agent:
    type: instance
    params:
      name: RAGPipelineAgent
      description: 'RAG pipeline: Retriever -> Analyzer -> Final Answer with citations.'
      sub_agents: [retriever_agent, analyzer_agent, final_answer_agent]

models:
  gemini-2.5-pro:
    type: literal
    agents: [retriever_agent, analyzer_agent, final_answer_agent]

tools:
  rag_retrieval_tool:
    type: function
    agents: [retriever_agent]

teams:
  root_agent:
    type: sequential
    agents: [root_agent, retriever_agent, analyzer_agent, final_answer_agent]

imports:
  LlmAgent: google.adk.agents.LlmAgent
  load_dotenv: dotenv.load_dotenv
  os: os
  rag: vertexai.preview.rag
  return_instructions_rag_analyser: prompts.return_instructions_rag_analyser
  return_instructions_rag_final_answer: prompts.return_instructions_rag_final_answer
  return_instructions_rag_retriever: prompts.return_instructions_rag_retriever
  SequentialAgent: google.adk.agents.SequentialAgent
  VertexAiRagRetrieval: google.adk.tools.retrieval.vertex_ai_rag_retrieval.VertexAiRagRetrieval

functions:
  return_instructions_rag_analyser:
    type: sync
    module: adk-rag-agent.prompts
    params:
      returns: str
  return_instructions_rag_final_answer:
    type: sync
    module: adk-rag-agent.prompts
    params:
      returns: str
  return_instructions_rag_retriever:
    type: sync
    module: adk-rag-agent.prompts
    params:
      returns: str

variables:
  RAG_CORPUS:
    type: env
    params:
      caller: [os.environ.get]
      path: [adk-rag-agent.agent]
